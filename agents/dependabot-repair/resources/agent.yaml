{
  "apiVersion": "core.orka.ai/v1alpha1",
  "kind": "Agent",
  "metadata": {
    "name": "dependabot-repair-v1"
  },
  "spec": {
    "runtime": {
      "type": "claude",
      "contractVersion": "orka.harness.v2",
      "defaultMaxTurns": 60,
      "defaultAllowBash": true,
      "defaultAllowedTools": ["Read", "Write", "Edit", "Bash", "Glob", "Grep"]
    },
    "model": {
      "name": "claude-haiku-4.5"
    },
    "systemPrompt": {
      "configMapRef": {
        "name": "system-prompt",
        "key": "system.md"
      }
    }
  }
}
